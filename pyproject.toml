[project]
name = "enterprise-support-agent"
version = "0.1.0"
description = "Enterprise policy and IT support agent with cited answers and safe ticket routing"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3",
    "pydantic-ai>=1.0",
    "ragas>=0.2",
    "httpx>=0.27",
    "sentence-transformers>=3.0",
    "openai>=1.50",
    "streamlit>=1.35",
    "alembic>=1.13",
    "pyyaml>=6.0",
    "numpy>=1.26",
    "pymupdf>=1.24,<2",
    "pdfplumber>=0.11,<1",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.ruff]
target-version = "py312"

[tool.pytest.ini_options]
pythonpath = ["."]
markers = [
    "integration: Requires PostgreSQL / pgvector / embedding model. Skipped by default.",
]
