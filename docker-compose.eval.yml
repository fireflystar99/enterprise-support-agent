services:
  # 评测数据库只在 Docker 内部网络暴露，规避 Windows 宿主机端口绑定限制。
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: support_agent
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d support_agent"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Runner 与 db 同网段，通过 db:5432 连接；不会向 Windows 发布任何端口。
  runner:
    build: .
    user: "0:0"
    entrypoint: []
    working_dir: /app
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/support_agent
      HF_ENDPOINT: https://huggingface.co
      HF_HOME: /tmp/huggingface
    volumes:
      - ./artifacts:/app/artifacts
      - ./.cache/huggingface:/tmp/huggingface
    depends_on:
      db:
        condition: service_healthy
